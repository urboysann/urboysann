<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-label="Cepat, Rapi, Siap Produksi"><g transform="translate(0,0)">
<rect x="0.5" y="0.5" width="319" height="179" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect x="0" y="0" width="320" height="3" rx="1.5" fill="#58a6ff"/>
<text x="24" y="52" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="1.5" fill="#58a6ff">01</text>
<text x="24" y="92" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="26" fill="#f0f6fc">CEPAT</text>
<text x="24" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">Performa dulu. Code splitting, lazy</text>
<text x="24" y="150" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">loading, optimasi gambar, caching.</text>
</g><g transform="translate(340,0)">
<rect x="0.5" y="0.5" width="319" height="179" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect x="0" y="0" width="320" height="3" rx="1.5" fill="#a371f7"/>
<text x="24" y="52" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="1.5" fill="#a371f7">02</text>
<text x="24" y="92" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="26" fill="#f0f6fc">RAPI</text>
<text x="24" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">Arsitektur bersih dan antarmuka</text>
<text x="24" y="150" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">pixel-perfect di semua perangkat.</text>
</g><g transform="translate(680,0)">
