<text x="24" y="52" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="1.5" fill="#3fb950">03</text>
<text x="24" y="92" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="26" fill="#f0f6fc">SIAP PRODUKSI</text>
<text x="24" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">Deployment stabil dengan Docker</text>
<text x="24" y="150" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">dan CI/CD, bukan cuma di laptop.</text>
