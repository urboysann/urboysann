<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Santika Kumara - Full-Stack Developer">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ecbff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="340" rx="16"/></clipPath>
    <clipPath id="r0"><rect x="84" y="214" height="36" width="0"><animate attributeName="width" values="0;312;312" keyTimes="0;0.12;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="r1"><rect x="84" y="214" height="36" width="0"><animate attributeName="width" values="0;0;390;390" keyTimes="0;0.333;0.453;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="r2"><rect x="84" y="214" height="36" width="0"><animate attributeName="width" values="0;0;406;406" keyTimes="0;0.666;0.786;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="#0d1117"/>
    <rect width="1000" height="340" fill="url(#grid)"/>
    <circle cx="860" cy="130" r="230" fill="url(#orb)">
      <animate attributeName="cx" values="860;820;860" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="130;160;130" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- title bar -->
    <rect width="1000" height="44" fill="#161b22"/>
    <line x1="0" y1="44" x2="1000" y2="44" stroke="#30363d"/>
    <circle cx="28" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="22" r="6" fill="#27c93f"/>
    <text x="500" y="27" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#8b949e">~/santikakumara &#8212; portfolio</text>

    <!-- status pill -->
    <rect x="60" y="72" width="262" height="28" rx="14" fill="#1f6feb" fill-opacity="0.12" stroke="#1f6feb" stroke-opacity="0.6"/>
    <circle cx="78" cy="86" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="92" y="90" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" letter-spacing="1" fill="#9ecbff" textLength="216" lengthAdjust="spacing">AVAILABLE FOR NEW PROJECTS</text>

    <!-- name -->
    <text x="60" y="180" font-family="'Arial Black','Segoe UI Black',Impact,'Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="88" fill="url(#name)" textLength="430" lengthAdjust="spacingAndGlyphs">SANTIKA</text>
    <text x="510" y="180" font-family="'Arial Black','Segoe UI Black',Impact,'Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="88" fill="none" stroke="#58a6ff" stroke-width="2" textLength="400" lengthAdjust="spacingAndGlyphs">KUMARA</text>

    <!-- role line -->
    <text x="60" y="240" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="26" fill="#58a6ff">$</text>

    <g clip-path="url(#r0)">
      <g>
        <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
        <text x="84" y="240" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="26" fill="#e6edf3" textLength="312" lengthAdjust="spacing">Full-Stack Developer</text>
      </g>
    </g>
    <g clip-path="url(#r1)">
      <g>
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.333;0.666;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
        <text x="84" y="240" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="26" fill="#e6edf3" textLength="390" lengthAdjust="spacing">Laravel · Next.js · Vue.js</text>
      </g>
    </g>
    <g clip-path="url(#r2)">
      <g>
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.666;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
        <text x="84" y="240" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="26" fill="#e6edf3" textLength="406" lengthAdjust="spacing">Cepat · Rapi · Siap Produksi</text>
      </g>
    </g>

    <!-- blinking cursor following the typed text -->
    <rect y="217" width="12" height="30" fill="#58a6ff">
      <animate attributeName="x" values="84;396;396;84;474;474;84;490;490" keyTimes="0;0.12;0.333;0.3331;0.453;0.666;0.6661;0.786;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- meta -->
    <text x="60" y="304" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#6e7681" textLength="520" lengthAdjust="spacing">D4 TRPL  //  POLITEKNIK NEGERI BALI  //  INDONESIA</text>

    <rect y="336" width="1000" height="4" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="339" rx="16" fill="none" stroke="#30363d"/>
</svg>
